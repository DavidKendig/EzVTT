{% extends "base.html" %}
{% block titleblock %} &mdash; Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">Log in</h3>

        {% if error %}
          <div class="alert alert-danger py-2">Invalid username or password.</div>
        {% endif %}

        <!-- Posts to the Java gateway, which owns authentication. -->
        <form method="post" action="/auth/login">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>

        <p class="text-muted small mt-3 mb-0">
          No account yet? <a href="/register">Create one</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
