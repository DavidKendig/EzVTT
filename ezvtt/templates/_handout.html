{# The handout overlay, shared by all three surfaces.

   The GM sees it too, and that is deliberate: it is how they know what is on
   the projector without turning round. Only they can take it down for everyone
   -- a player closing it closes their own copy. #}

<div class="handout" id="handout-overlay" hidden>
  <figure class="handout__frame">
    <img class="handout__image" data-handout-image alt="">
    <figcaption class="handout__title" data-handout-title></figcaption>
  </figure>

  <button class="handout__close" data-handout-close type="button"
          title="Close">&times;</button>
</div>
